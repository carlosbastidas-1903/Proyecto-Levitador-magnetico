<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Maglev VR - Lazo Abierto vs Lazo Cerrado</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d1117; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Panel Físico Original */
        #panel {
            position: absolute; top: 15px; left: 15px; color: #ffffff;
            background: rgba(10, 20, 30, 0.85); padding: 20px; border-radius: 12px;
            border: 1px solid #4a5568; min-width: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10;
            cursor: move;
        }
        #panel h3 { margin-top: 0; border-bottom: 1px solid #4a5568; padding-bottom: 10px; color: #e2e8f0; cursor: move; }
        .data-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
        .data-label { color: #a0aec0; }
        .mono-val { font-family: monospace; font-weight: bold; }
        
        /* Nuevo Panel de Osciloscopio Arrastrable */
        #scope_panel {
            position: absolute; top: 15px; right: 15px; color: #ffffff;
            background: rgba(10, 20, 30, 0.85); padding: 15px; border-radius: 12px;
            border: 1px solid #4a5568; width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10;
            cursor: move;
        }
        #scope_panel h3 { margin-top: 0; border-bottom: 1px solid #4a5568; padding-bottom: 10px; color: #68d391; cursor: move; font-size: 16px; }
        
        /* Contenedor del Canvas para el Osciloscopio */
        .scope-container {
            background: #000000;
            border: 2px solid #2d3748;
            border-radius: 8px;
            padding: 5px;
            margin-bottom: 10px;
            position: relative;
        }
        #scopeCanvas {
            width: 100%;
            height: 160px;
            display: block;
            background: radial-gradient(circle, #112211 0%, #000000 100%);
        }
        .scope-legend {
            display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 5px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .box-color { width: 10px; height: 10px; display: inline-block; border-radius: 2px; }

        /* Panel de Controles Original */
        #controls {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 20px; border-radius: 12px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px; z-index: 10;
            cursor: move;
        }
        input[type=range], button, .toggle-container { cursor: pointer; }
        
        .toggle-container {
            background: #2ea043; color: white; padding: 12px; border-radius: 8px;
            margin-bottom: 15px; font-weight: bold;
            transition: background 0.3s;
        }
        .toggle-container.off { background: #d73a49; }
        
        #btn_reset {
            background: #0366d6; color: white; border: none; padding: 10px;
            width: 100%; border-radius: 8px; font-weight: bold;
            margin-top: 10px; transition: 0.2s;
        }
        #btn_reset:hover { background: #005cc5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <!-- Ventana 1: Estados Físicos -->
    <div id="panel">
        <h3>Dinámica del Maglev</h3>
        <div class="data-row"><span class="data-label">Posición (x1):</span> <span id="val_x1" class="mono-val"></span> cm</div>
        <div class="data-row"><span class="data-label">Velocidad (x2):</span> <span id="val_x2" class="mono-val"></span> cm/s</div>
        <div class="data-row"><span class="data-label">Corriente (x3):</span> <span id="val_x3" class="mono-val"></span> A</div>
        <div class="data-row"><span class="data-label">Voltaje Op-Amp (u):</span> <span id="val_real_u" class="mono-val" style="color: #ffaa00;"></span> V</div>
    </div>

    <!-- Ventana 2: Osciloscopio Canónico -->
    <div id="scope_panel">
        <h3>Osciloscopio Canónico</h3>
        
        <div class="scope-legend">
            <div class="legend-item"><span class="box-color" style="background: #00ffcc;"></span> Salida Real (Δy)</div>
            <div class="legend-item"><span class="box-color" style="background: #ffaa00;"></span> Referencia (Set)</div>
        </div>
        
        <div class="scope-container">
            <canvas id="scopeCanvas" width="286" height="160"></canvas>
        </div>

        <div class="data-row" style="border-top: 1px solid #4a5568; padding-top: 8px; margin-bottom: 0;">
            <span class="data-label">Salida Actual (Δy):</span> 
            <span id="val_dy" class="mono-val" style="color: #00ffcc; text-shadow: 0 0 5px #00ffcc;">0.00 cm</span>
        </div>
    </div>

    <!-- Ventana 3: Controles -->
    <div id="controls">
        <div id="btn_toggle" class="toggle-container off">
            ESTADO: LAZO ABIERTO (Inestable)
        </div>
        
        <label id="slider_label" style="font-weight: bold; color: #333;">Voltaje Manual (V): <span id="slider_val">7.00</span></label>
        <input type="range" id="main_slider" min="0" max="15" step="0.01" value="7.00">
        <p id="help_text" style="font-size: 12px; color: #666; margin: 0;">Intenta mantener la bola flotando ajustando el voltaje.</p>
        
        <button id="btn_reset">Levantar Esfera (Reset Posición)</button>
    </div>

    <script>
        // --- LÓGICA DE PANELES ARRASTRABLES ---
        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            element.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                if (e.target.id === 'btn_toggle' || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'CANVAS') return;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                let rect = element.getBoundingClientRect();
                element.style.bottom = 'auto';
                element.style.right = 'auto';
                element.style.top = rect.top + "px";
                element.style.left = rect.left + "px";

                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        makeDraggable(document.getElementById("panel"));
        makeDraggable(document.getElementById("scope_panel"));
        makeDraggable(document.getElementById("controls"));

        // --- LÓGICA DEL OSCILOSCOPIO ---
        const canvas = document.getElementById('scopeCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        // Buffers para la gráfica
        const maxPoints = width; 
        const dataY = new Array(maxPoints).fill(0); // Salida del sistema Δy
        const dataRef = new Array(maxPoints).fill(0); // Referencia (Setpoint)
        let scopeIndex = 0;

        function drawOscilloscope() {
            // Limpiar fondo con un ligero trazo negro para efecto de desvanecimiento (ghosting)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Dibujar la cuadrícula (Grid)
            ctx.strokeStyle = '#1a361a';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i = 0; i < width; i += 20) { ctx.moveTo(i, 0); ctx.lineTo(i, height); }
            for(let i = 0; i < height; i += 20) { ctx.moveTo(0, i); ctx.lineTo(width, i); }
            ctx.stroke();
            
            // Línea central (0 cm / Punto de equilibrio)
            ctx.strokeStyle = '#387c38';
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            ctx.lineTo(width, height / 2);
            ctx.stroke();

            // Dibujar Referencia (Setpoint) - Naranja
            ctx.beginPath();
            ctx.strokeStyle = '#ffaa00';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < maxPoints; i++) {
                let idx = (scopeIndex + i) % maxPoints;
                // Escalar: Rango de visualización de -3cm a +3cm en el scope
                let yPos = height/2 - (dataRef[idx] * (height/6)); 
                if (i === 0) ctx.moveTo(i, yPos);
                else ctx.lineTo(i, yPos);
            }
            ctx.stroke();

            // Dibujar Señal Canónica de Salida (Δy) - Cyan Brillante
            ctx.beginPath();
            ctx.strokeStyle = '#00ffcc';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00ffcc';
            ctx.lineWidth = 2;
            for (let i = 0; i < maxPoints; i++) {
                let idx = (scopeIndex + i) % maxPoints;
                let yPos = height/2 - (dataY[idx] * (height/6));
                
                // Limitar visualmente si se sale de la pantalla
                yPos = Math.max(0, Math.min(height, yPos));
                
                if (i === 0) ctx.moveTo(i, yPos);
                else ctx.lineTo(i, yPos);
            }
            ctx.stroke();
            
            // Resetear sombra para no afectar otras cosas
            ctx.shadowBlur = 0;
        }

        // --- 1. CONFIGURACIÓN VISUAL 3D (INTACTA) ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d1117, 4); 
        
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0.08, 0.3);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.05;
        orbitControls.target.set(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6)); 
        const topLight = new THREE.SpotLight(0xffffff, 2);
        topLight.position.set(0.1, 0.3, 0.1);
        topLight.castShadow = true;
        scene.add(topLight);
        
        const frontLight = new THREE.DirectionalLight(0xffffff, 1.5);
        frontLight.position.set(0, 0.1, 0.5);
        scene.add(frontLight);

        const gridHelper = new THREE.GridHelper(0.5, 50, 0x555555, 0x222222);
        gridHelper.position.y = -0.075;
        scene.add(gridHelper);

        const standMat = new THREE.MeshPhongMaterial({ color: 0x444444, shininess: 30, specular: 0x222222 });
        
        const baseGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.005, 32);
        const base = new THREE.Mesh(baseGeo, standMat);
        base.position.set(0, -0.0725, 0);
        base.castShadow = true;
        base.receiveShadow = true;
        scene.add(base);

        const pillarGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.14, 16);
        const pillar = new THREE.Mesh(pillarGeo, standMat);
        pillar.position.set(0, -0.005, -0.04);
        pillar.castShadow = true;
        scene.add(pillar);

        const armGeo = new THREE.BoxGeometry(0.02, 0.015, 0.05);
        const arm = new THREE.Mesh(armGeo, standMat);
        arm.position.set(0, 0.057, -0.015);
        arm.castShadow = true;
        scene.add(arm);

        const magnet = new THREE.Group();
        magnet.position.set(0, 0.035, 0);

        const topGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.015, 32);
        const topMat = new THREE.MeshPhongMaterial({ color: 0xff1111, shininess: 100, specular: 0x444444 });
        const topMagnet = new THREE.Mesh(topGeo, topMat);
        topMagnet.position.y = 0.0075;
        topMagnet.castShadow = true;
        magnet.add(topMagnet);

        const bottomGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.015, 32);
        const bottomMat = new THREE.MeshPhongMaterial({ color: 0x1166ff, shininess: 100, specular: 0x444444 });
        const bottomMagnet = new THREE.Mesh(bottomGeo, bottomMat);
        bottomMagnet.position.y = -0.0075;
        bottomMagnet.castShadow = true;
        magnet.add(bottomMagnet);

        scene.add(magnet);

        const sphereGeo = new THREE.SphereGeometry(0.008, 32, 32);
        const sphereMat = new THREE.MeshPhongMaterial({ color: 0xdcdcdc, specular: 0xffffff, shininess: 150 });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.castShadow = true;
        scene.add(sphere);

        const targetGeo = new THREE.TorusGeometry(0.012, 0.001, 16, 32);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.7 });
        const targetRing = new THREE.Mesh(targetGeo, targetMat);
        targetRing.rotation.x = Math.PI / 2;
        targetRing.visible = false;
        scene.add(targetRing);

        const trailDotsCount = 20; 
        const trailMeshes = [];
        const dotGeo = new THREE.SphereGeometry(0.0015, 8, 8);
        
        for (let i = 0; i < trailDotsCount; i++) {
            const dotMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                transparent: true, 
                opacity: 1 - (i / trailDotsCount) 
            });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.visible = false;
            scene.add(dot);
            trailMeshes.push(dot);
        }
        let frameCounter = 0;

        // --- 2. FÍSICA Y CONTROLADOR (INTACTOS) ---
        const m = 0.05, g = 9.81, k = 1e-4, R = 10.0, L = 0.1;
        let x1 = 0.01, x2 = 0.0, x3 = 0.70035; 
        let u = 7.00; 
        
        let isClosedLoop = false;
        let setpoint = 0.01; 

        const toggleBtn = document.getElementById('btn_toggle');
        const slider = document.getElementById('main_slider');
        const sliderLabel = document.getElementById('slider_label');
        const helpText = document.getElementById('help_text');
        const btnReset = document.getElementById('btn_reset');

        function resetPosition() {
            x1 = 0.01; 
            x2 = 0;    
            
            if (isClosedLoop) {
                x1 = setpoint; 
                x3 = x1 * Math.sqrt((m * g) / k); 
            } else {
                u = parseFloat(slider.value); 
                x3 = u / R; 
            }
            
            trailMeshes.forEach(dot => dot.visible = false);
            // Limpiar gráfica al resetear
            dataY.fill(0);
            dataRef.fill(0);
        }

        btnReset.addEventListener('click', resetPosition);

        toggleBtn.addEventListener('click', () => {
            isClosedLoop = !isClosedLoop;
            targetRing.visible = isClosedLoop;
            
            if (isClosedLoop) {
                toggleBtn.className = "toggle-container";
                toggleBtn.innerHTML = "ESTADO: LAZO CERRADO (Automático ON)";
                slider.min = "0.5"; slider.max = "5"; slider.step = "0.1";
                slider.value = (setpoint * 100).toString();
                sliderLabel.innerHTML = 'Posición Deseada (cm): <span id="slider_val">' + slider.value + '</span>';
                helpText.innerText = "El controlador ajusta el voltaje solo. Mueve el deslizador para cambiar la altura.";
                btnReset.innerText = "Ayudar al Controlador (Reset)";
                resetPosition();
            } else {
                toggleBtn.className = "toggle-container off";
                toggleBtn.innerHTML = "ESTADO: LAZO ABIERTO (Inestable)";
                slider.min = "0"; slider.max = "15"; slider.step = "0.01";
                slider.value = u.toString();
                sliderLabel.innerHTML = 'Voltaje Manual (V): <span id="slider_val">' + slider.value + '</span>';
                helpText.innerText = "Intenta mantener la bola flotando ajustando el voltaje manualmente.";
                btnReset.innerText = "Levantar Esfera (Reset Posición)";
            }
        });

        slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('slider_val').innerText = val.toFixed(2);
            if (isClosedLoop) {
                setpoint = val / 100.0;
            } else {
                u = val;
            }
        });

        function computeControllerVoltage() {
            let i_eq = setpoint * Math.sqrt((m * g) / k);
            let u_eq = R * i_eq;
            let error = x1 - setpoint; 
            let d_error = x2;
            
            let Kp = 3500;
            let Kd = 100;
            
            let control_u = u_eq + (Kp * error) + (Kd * d_error);
            return Math.max(0, Math.min(24, control_u)); 
        }

        // --- 3. BUCLE DE SIMULACIÓN ---
        const subSteps = 10;
        const dt = 0.016 / subSteps; 

        function animate() {
            requestAnimationFrame(animate);

            orbitControls.update();

            for (let i = 0; i < subSteps; i++) {
                if (isClosedLoop) {
                    u = computeControllerVoltage();
                }
                let x1_safe = Math.max(x1, 0.001); 
                
                let dx1 = x2;
                let dx2 = g - (k / m) * Math.pow(x3 / x1_safe, 2);
                let dx3 = -(R / L) * x3 + (1 / L) * u;

                x1 += dx1 * dt;
                x2 += dx2 * dt;
                x3 += dx3 * dt;

                if (x1 < 0.002) { x1 = 0.002; x2 = 0; } 
                if (x1 > 0.075) { x1 = 0.075; x2 = 0; } 
            }

            sphere.position.y = magnet.position.y - 0.015 - x1;
            targetRing.position.y = magnet.position.y - 0.015 - setpoint;

            frameCounter++;
            if (frameCounter % 3 === 0) {
                for (let i = trailMeshes.length - 1; i > 0; i--) {
                    trailMeshes[i].position.copy(trailMeshes[i - 1].position);
                    trailMeshes[i].visible = trailMeshes[i - 1].visible;
                    trailMeshes[i].material.color.copy(trailMeshes[i - 1].material.color);
                }
                
                trailMeshes[0].position.copy(sphere.position);
                trailMeshes[0].visible = true;
                
                if (x2 > 0.02) {
                    trailMeshes[0].material.color.setHex(0xff3333); 
                } else if (x2 < -0.02) {
                    trailMeshes[0].material.color.setHex(0x3399ff); 
                } else {
                    trailMeshes[0].material.color.setHex(0x00ffcc); 
                }
            }

            // Actualizar panel físico de texto
            document.getElementById('val_x1').innerText = (x1 * 100).toFixed(2);
            document.getElementById('val_x2').innerText = (x2 * 100).toFixed(2);
            document.getElementById('val_x3').innerText = x3.toFixed(3);
            document.getElementById('val_real_u').innerText = u.toFixed(2);

            // --- ACTUALIZACIÓN DEL OSCILOSCOPIO CANÓNICO ---
            // Calcular desviación respecto al punto de equilibrio (0.01 m)
            let deltaY_cm = (x1 - 0.01) * 100;
            let deltaRef_cm = (setpoint - 0.01) * 100;
            
            // Si está en lazo abierto y muy inestable, lo acotamos visualmente para que no dañe la gráfica
            if (deltaY_cm > 15) deltaY_cm = 15;

            // Inyectar datos al buffer circular
            dataY[scopeIndex] = deltaY_cm;
            dataRef[scopeIndex] = isClosedLoop ? deltaRef_cm : (u - 7.00); // En abierto mostramos la variación de voltaje como ref
            scopeIndex = (scopeIndex + 1) % maxPoints;

            // Renderizar la gráfica y actualizar el texto de salida
            drawOscilloscope();
            document.getElementById('val_dy').innerText = (deltaY_cm).toFixed(2) + " cm";

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
